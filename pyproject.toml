[project]
name = "featherweb"
dynamic = ["version"]
description = "Lightweight async web framework with class-based controllers and zero required dependencies"
readme = "README.md"
authors = [
    { name = "lucas-lmoura", email = "mouradev1997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
featherweb = "featherweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "uvicorn>=0.53.0",
]

[tool.hatch.version]
path = "src/featherweb/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PERF", "ASYNC", "PT", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["featherweb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
