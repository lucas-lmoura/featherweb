[project]
name = "featherweb"
dynamic = ["version"]
description = "Lightweight async web framework with class-based controllers and zero required dependencies"
readme = "README.md"
authors = [
    { name = "lucas-lmoura", email = "mouradev1997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["asgi", "async", "web", "framework", "http", "websocket", "controllers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lucas-lmoura/featherweb"
Repository = "https://github.com/lucas-lmoura/featherweb"
Issues = "https://github.com/lucas-lmoura/featherweb/issues"

[project.optional-dependencies]
# Only for the JWT algorithms the standard library cannot do (RS*/ES*).
crypto = ["cryptography>=43"]

[project.scripts]
featherweb = "featherweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
bench = [
    "blacksheep>=2.6.3",
    "falcon>=4.3.1",
    "fastapi>=0.141.1",
    "litestar>=2.24.0",
    "quart>=0.22.0",
]
dev = [
    "coverage>=7.16.1",
    "cryptography>=50.0.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[tool.hatch.version]
path = "src/featherweb/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PERF", "ASYNC", "PT", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["featherweb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
